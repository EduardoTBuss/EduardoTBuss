<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Eduardo Timm Buss — research profile</title>
  <desc id="desc">Animated scientific profile with a Bloch sphere and variational quantum circuit.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .eyebrow { fill: #29e6f2; font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .title { fill: #e6f4ff; font-size: 36px; font-weight: 720; letter-spacing: -1px; }
    .heading { fill: #e6f4ff; font-size: 22px; font-weight: 700; }
    .subheading { fill: #a78bfa; font-size: 16px; font-weight: 700; letter-spacing: .7px; }
    .body { fill: #91a7bd; font-size: 15px; }
    .small { fill: #91a7bd; font-size: 12px; }
    .code { fill: #29e6f2; font-size: 13px; }
    .panel { fill: #091326; stroke: #17375a; stroke-width: 1.2; fill-opacity: 0; stroke-dasharray: 1700; stroke-dashoffset: 1700; animation: panelBuild 1.05s ease forwards; animation-delay: calc(var(--section-delay, 0s) + var(--panel-delay, .25s)); }
    .panel2 { fill: #0c1930; stroke: #17375a; stroke-width: 1.2; fill-opacity: 0; stroke-dasharray: 1700; stroke-dashoffset: 1700; animation: panelBuild 1.05s ease forwards; animation-delay: calc(var(--section-delay, 0s) + var(--panel-delay, .25s)); }
    .reveal { opacity: 0; transform: translateY(8px); animation: reveal .72s ease forwards; animation-delay: calc(var(--section-delay, 0s) + var(--delay, 0s)); }
    .draw { stroke-dasharray: var(--length, 500); stroke-dashoffset: var(--length, 500); animation: draw 1.4s ease forwards; animation-delay: calc(var(--section-delay, 0s) + var(--delay, .2s)); }
    .pulse { animation: pulse 2.5s ease-in-out infinite; animation-delay: calc(var(--section-delay, 0s) + var(--delay, 0s)); transform-box: fill-box; transform-origin: center; }
    .signal { stroke-dasharray: 4 14; animation: signal 2.8s linear infinite; animation-delay: var(--section-delay, 0s); }
    .float { animation: float 4s ease-in-out infinite; animation-delay: var(--section-delay, 0s); }
    .gridBoot { opacity: 0; animation: gridBoot 1.4s ease forwards; animation-delay: var(--section-delay, 0s); }
    .borderBoot { stroke-dasharray: 3200; stroke-dashoffset: 3200; animation: draw 1.35s ease forwards; animation-delay: var(--section-delay, 0s); }
    .cornerBoot { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw .85s ease forwards; animation-delay: calc(var(--section-delay, 0s) + .12s); }
    .scan { animation: scan 2.5s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--section-delay, 0s); }
    .layerNode { transform-box: fill-box; transform-origin: center; animation: layerNode 4s ease-in-out infinite; animation-delay: calc(var(--section-delay, 0s) + var(--node-delay, 0s)); }
    .connectionStage { animation: connectionGlow 4s ease-in-out infinite; animation-delay: calc(var(--section-delay, 0s) + var(--edge-delay, 0s)); }
    .traveler { filter: url(#glow); }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes panelBuild { 0% { fill-opacity: 0; stroke-dashoffset: 1700; } 62% { fill-opacity: 0; stroke-dashoffset: 0; } 100% { fill-opacity: 1; stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes signal { to { stroke-dashoffset: -72; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes gridBoot { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0; } 10% { opacity: .9; } 88% { opacity: .55; } 100% { transform: translateY(520px); opacity: 0; } }
    @keyframes layerNode { 0%, 18%, 100% { opacity: .42; transform: scale(.82); } 27%, 42% { opacity: 1; transform: scale(1.45); } 55% { opacity: .72; transform: scale(1); } }
    @keyframes connectionGlow { 0%, 18%, 100% { opacity: .18; } 25%, 48% { opacity: .95; } 62% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .reveal, .draw, .pulse, .signal, .float, .gridBoot, .borderBoot, .cornerBoot, .scan, .layerNode, .connectionStage, .panel, .panel2 { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; animation-fill-mode: both !important; }
      .traveler { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a16"/><stop offset=".52" stop-color="#061326"/><stop offset="1" stop-color="#09091b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#29e6f2"/><stop offset=".52" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#29e6f2" stop-opacity=".17"/><stop offset=".7" stop-color="#a78bfa" stop-opacity=".06"/><stop offset="1" stop-color="#050a16" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#123050" stroke-opacity=".27" stroke-width="1"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="22" fill="url(#grid)" class="gridBoot"/>
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#18395d" class="borderBoot"/>
  <path d="M24 12H150 M12 24V90 M1176 508H1050 M1188 496V430" stroke="url(#accent)" stroke-width="2" opacity=".7" class="cornerBoot"/>
  <rect x="18" y="0" width="1164" height="2" rx="1" fill="url(#accent)" opacity="0" class="scan" filter="url(#glow)"/>

  <circle cx="660" cy="270" r="250" fill="url(#orb)"/>
  <g class="reveal" style="--delay:.08s">
    <text x="58" y="64" class="eyebrow">RESEARCH PROFILE / SYSTEM ONLINE</text>
    <circle cx="37" cy="58" r="5" fill="#29e6f2" class="pulse" filter="url(#glow)"/>
  </g>
  <g class="reveal" style="--delay:.22s">
    <text x="56" y="132" class="title">Eduardo Timm Buss</text>
    <text x="58" y="164" fill="#a78bfa" font-size="22" font-weight="700">@EduardoTBuss</text>
    <text x="58" y="202" class="subheading">Computer Engineering @ UFPel</text>
    <text x="58" y="227" class="body">Undergraduate Researcher</text>
  </g>
  <g class="reveal" style="--delay:.38s">
    <text x="58" y="275" class="body"><tspan x="58" dy="0">I build and study computational systems at the</tspan><tspan x="58" dy="24">intersection of quantum computing, fuzzy logic,</tspan><tspan x="58" dy="24">artificial intelligence and digital hardware.</tspan></text>
    <rect x="58" y="374" width="176" height="30" rx="15" fill="#0b2133" stroke="#1d5268"/>
    <circle cx="76" cy="389" r="4" fill="#52e0a4" class="pulse"/>
    <text x="89" y="394" class="small">Pelotas, RS, Brazil</text>
    <text x="58" y="444" class="small">FIELDS /</text>
    <text x="58" y="470" fill="#29e6f2" font-size="13">Quantum Computing · Fuzzy Systems · Artificial Intelligence · Computer Vision</text>
  </g>

  <!-- Bloch sphere -->
  <g class="reveal" style="--delay:.34s"><g class="float">
    <circle cx="665" cy="277" r="170" fill="#061426" fill-opacity=".5" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.6" class="draw" style="--length:1100;--delay:.55s"/>
    <ellipse cx="665" cy="277" rx="170" ry="52" fill="none" stroke="#a78bfa" stroke-opacity=".65" class="draw" style="--length:760;--delay:.75s"/>
    <ellipse cx="665" cy="277" rx="170" ry="116" fill="none" stroke="#38bdf8" stroke-opacity=".28" class="draw" style="--length:930;--delay:.86s"/>
    <ellipse cx="665" cy="277" rx="64" ry="170" fill="none" stroke="#29e6f2" stroke-opacity=".35" class="draw" style="--length:930;--delay:.95s"/>
    <ellipse cx="665" cy="277" rx="128" ry="170" fill="none" stroke="#a78bfa" stroke-opacity=".22" class="draw" style="--length:1100;--delay:1.02s"/>
    <path d="M487 277H843 M665 91V464 M530 390L800 164" fill="none" stroke="#8ecff5" stroke-opacity=".72" stroke-width="1.3" class="draw" style="--length:760;--delay:1.1s"/>
    <path d="M665 277L752 160" stroke="#29e6f2" stroke-width="3" marker-end="url(#arrow)" class="draw" filter="url(#glow)" style="--length:160;--delay:1.3s"/>
    <path d="M722 201A74 74 0 0 0 665 179" fill="none" stroke="#d56dff" stroke-width="2" class="draw" style="--length:150;--delay:1.52s"/>
    <circle cx="752" cy="160" r="6" fill="#29e6f2" class="pulse" style="--delay:1.5s" filter="url(#glow)"/>
    <circle cx="526" cy="329" r="4" fill="#d56dff" class="pulse" style="--delay:.8s"/>
    <text x="760" y="154" fill="#29e6f2" font-size="16">|ψ⟩</text>
    <text x="711" y="195" fill="#d56dff" font-size="15">θ</text>
    <text x="795" y="299" fill="#91a7bd" font-size="14">+x</text>
    <text x="650" y="78" fill="#91a7bd" font-size="14">|0⟩</text>
    <text x="650" y="486" fill="#91a7bd" font-size="14">|1⟩</text>
    <text x="552" y="129" class="eyebrow">BLOCH STATE / 01</text>
  </g></g>

  <!-- VQC -->
  <g class="reveal" style="--delay:1.25s">
    <rect x="858" y="76" width="298" height="356" rx="17" class="panel" style="--panel-delay:1.18s"/>
    <text x="882" y="110" class="eyebrow">VQC / SIGNAL PREVIEW</text>
    <text x="882" y="134" class="small">ENCODE x → U(θ) → ENTANGLE → ⟨Z⟩</text>
    <g stroke="#426688" stroke-width="1.5">
      <path d="M880 184H1134 M880 239H1134 M880 294H1134 M880 349H1134"/>
    </g>
    <g fill="#101d36" stroke="#38bdf8">
      <rect x="901" y="166" width="42" height="36" rx="7"/><rect x="901" y="221" width="42" height="36" rx="7"/><rect x="901" y="276" width="42" height="36" rx="7"/><rect x="901" y="331" width="42" height="36" rx="7"/>
    </g>
    <g fill="#151433" stroke="#a78bfa">
      <rect x="966" y="166" width="47" height="36" rx="7"/><rect x="966" y="221" width="47" height="36" rx="7"/><rect x="966" y="276" width="47" height="36" rx="7"/><rect x="966" y="331" width="47" height="36" rx="7"/>
    </g>
    <g fill="#e6f4ff" font-size="10" text-anchor="middle">
      <text x="922" y="188">Rᵧ(xᵢ)</text><text x="922" y="243">Rᵧ(xᵢ)</text><text x="922" y="298">Rᵧ(xᵢ)</text><text x="922" y="353">Rᵧ(xᵢ)</text>
      <text x="989" y="188">Rᵧ(θᵢ)</text><text x="989" y="243">Rᵧ(θᵢ)</text><text x="989" y="298">Rᵧ(θᵢ)</text><text x="989" y="353">Rᵧ(θᵢ)</text>
    </g>
    <g stroke="#29e6f2" stroke-width="1.5" class="draw signal" style="--length:500;--delay:1.5s">
      <path d="M1043 184V239"/><path d="M1073 294V349"/><path d="M1102 239V294"/>
    </g>
    <g fill="#29e6f2"><circle cx="1043" cy="184" r="5"/><circle cx="1073" cy="294" r="5"/><circle cx="1102" cy="239" r="5"/></g>
    <g fill="none" stroke="#29e6f2"><circle cx="1043" cy="239" r="9"/><path d="M1034 239H1052M1043 230V248"/><circle cx="1073" cy="349" r="9"/><path d="M1064 349H1082M1073 340V358"/><circle cx="1102" cy="294" r="9"/><path d="M1093 294H1111M1102 285V303"/></g>
    <g fill="#d56dff" font-size="13" text-anchor="middle"><text x="1131" y="189">Z</text><text x="1131" y="244">Z</text><text x="1131" y="299">Z</text><text x="1131" y="354">Z</text></g>
    <text x="882" y="402" class="code">θ ← classical optimizer / C(θ)</text>
  </g>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#29e6f2"/></marker></defs>
</svg>
