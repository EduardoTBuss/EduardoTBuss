name: Update public GitHub snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # GitHub Actions rejects a workflow that sets both `paths` and
    # `paths-ignore` on the same event, so the README exclusion is folded
    # into this allow-list as a negated entry instead of a separate key.
    # Net effect is exactly "paths-ignore: README.md": a commit that only
    # touches README.md never re-triggers this workflow.
    paths:
      - "data/profile.json"
      - "data/research.json"
      - "data/projects.json"
      - "data/publications.json"
      - "data/now.json"
      - "data/cv.json"
      - "scripts/generate_visuals.py"
      - "scripts/profile_kit/**"
      - "!README.md"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate data, refresh GitHub metrics and render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_visuals.py --validate-data --refresh-github --render-readme

      - name: Commit changed snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json generated/ README.md
          if git diff --cached --quiet; then
            echo "No public profile changes."
            exit 0
          fi
          git commit -m "chore: refresh public profile snapshot"
          git push
