name: Contribution snake

# The snake is drawn from the public contribution graph and force-pushed to the
# orphan `output` branch as a single commit (keep_history: false), so `main`
# never gets a commit from this workflow. When the graph has not changed the
# generated files are identical and nothing is published.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
